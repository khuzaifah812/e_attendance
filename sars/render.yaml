services:
  - type: web
    name: sars
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sars.wsgi:application --workers 1 --threads 4 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # paste the Clever Cloud MySQL URI here
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
